name: Auto-Build & Publish Release (Windows, Linux, macOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - 'Beta*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: Z-VideoEditor-Windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            artifact_name: Z-VideoEditor-Linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            artifact_name: Z-VideoEditor-macOS.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Linux Setup ---
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev portaudio19-dev \
            libsqlite3-dev libopencv-dev pkg-config zip tar

      # --- macOS Setup ---
      - name: Install macOS Dependencies
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install qt6 ffmpeg opencv portaudio sqlite3 pkg-config ninja cmake

      # --- Windows Setup ---
      - name: Setup MSYS2 MinGW-64 on Windows
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-sqlite3
            zip

      # --- Build Process (Linux & macOS) ---
      - name: Build Executable (Linux / macOS)
        if: matrix.platform != 'windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # --- Build Process (Windows) ---
      - name: Build Executable (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # --- Packaging Binaries ---
      - name: Package Windows Binary (bundle all DLLs)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          MINGW_BIN="/mingw64/bin"
          mkdir -p release_pkg

          # Find the exe (search build tree in case path differs)
          EXE=$(find build -name "z.exe" | head -1)
          if [[ -z "$EXE" ]]; then
            echo "ERROR: z.exe not found in build tree!"
            find build -type f | head -30
            exit 1
          fi
          echo "Found exe: $EXE"
          cp "$EXE" release_pkg/

          # Copy plugins and docs
          cp -r plugins release_pkg/ || true
          cp -r docs release_pkg/ || true

          # --- windeployqt6 for Qt DLLs ---
          echo "=== Running windeployqt6 ==="
          WINDEPLOYQT=$(which windeployqt6.exe 2>/dev/null || echo "$MINGW_BIN/windeployqt6.exe")
          "$WINDEPLOYQT" \
            --no-translations \
            --no-system-d3d-compiler \
            --no-opengl-sw \
            --dir release_pkg \
            release_pkg/z.exe && echo "windeployqt6 OK" || echo "windeployqt6 failed (continuing)"

          # --- Use ldd to auto-collect ALL required mingw64 DLLs ---
          echo "=== Collecting all DLL dependencies via ldd ==="
          collect_deps() {
            local bin="$1"
            ldd "$bin" 2>/dev/null \
              | grep -i '/mingw64/' \
              | awk '{print $3}' \
              | sort -u
          }

          # Collect deps of exe + any Qt plugin DLLs already in release_pkg
          {
            collect_deps "release_pkg/z.exe"
            find release_pkg -name "*.dll" | while read dll; do
              collect_deps "$dll"
            done
          } | sort -u | while read dep; do
            if [[ -f "$dep" ]]; then
              dest="release_pkg/$(basename "$dep")"
              if [[ ! -f "$dest" ]]; then
                cp "$dep" release_pkg/ && echo "  + $(basename $dep)"
              fi
            fi
          done

          echo "=== Final contents of release_pkg ==="
          ls release_pkg/*.dll | wc -l
          ls release_pkg/

          # --- Zip ---
          cd release_pkg && zip -r ../Z-VideoEditor-Windows-x64.zip .

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(z VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw 'Could not determine the Z version from CMakeLists.txt.' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\Z.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Package Linux Binary
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release_pkg
          cp build/bin/z release_pkg/ 2>/dev/null || cp build/z release_pkg/
          cp -r plugins release_pkg/
          cp -r docs release_pkg/
          tar -czvf Z-VideoEditor-Linux-x64.tar.gz -C release_pkg .

      - name: Package macOS Binary
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release_pkg
          cp -r build/bin/*.app release_pkg/ 2>/dev/null || cp -r build/*.app release_pkg/ 2>/dev/null || cp build/bin/z release_pkg/
          cp -r plugins release_pkg/
          cp -r docs release_pkg/
          cd release_pkg && zip -r ../Z-VideoEditor-macOS.zip .

      # --- Upload Package Artifact ---
      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: ${{ matrix.artifact_name }}

      - name: Upload Windows Installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Z-VideoEditor-Setup-Windows-x64.exe

  release:
    name: Create & Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag
        run: |
          INITIAL_VERSION="1.1.2"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # If triggered by a git tag push, use that tag directly
            TAG_NAME="${{ github.ref_name }}"
          else
            # Fetch the latest release tag and auto-increment the patch version
            LATEST=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              | jq -r '.tag_name // empty')

            if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
              # No releases yet, start at the current integer SemVer release.
              TAG_NAME="v${INITIAL_VERSION}"
            else
              # Accept either V1.1.1 or v1.1.1, then require exactly three
              # integer parts. This avoids timestamps, decimals, and shell
              # numeric conversions that can misinterpret leading zeroes.
              VERSION="${LATEST#[vV]}"
              if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                PATCH=$((10#$PATCH + 1))
                TAG_NAME="v${MAJOR}.${MINOR}.${PATCH}"
              else
                # Non-SemVer tags (for example Beta) start the clean series.
                TAG_NAME="v${INITIAL_VERSION}"
              fi
            fi
          fi
          echo "Using tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Z Video Editor ${{ steps.tag.outputs.tag_name }}
          body: |
            ## Z Video Editor Release ${{ steps.tag.outputs.tag_name }}
            Realtime GPU GLSL Shader & Datamosh Video Editor.
            
            ### Included Assets:
            - **Windows (x64)**: `Z-VideoEditor-Windows-x64.zip`
            - **Windows installer (x64)**: `Z-VideoEditor-Setup-Windows-x64.exe`
            - **Linux (x64)**: `Z-VideoEditor-Linux-x64.tar.gz`
            - **macOS**: `Z-VideoEditor-macOS.zip`
          draft: false
          prerelease: false
          files: |
            release_assets/Z-VideoEditor-Windows-x64.zip
            release_assets/Z-VideoEditor-Setup-Windows-x64.exe
            release_assets/Z-VideoEditor-Linux-x64.tar.gz
            release_assets/Z-VideoEditor-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
